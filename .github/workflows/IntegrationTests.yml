name: Integration Tests
on: [push, pull_request,repository_dispatch]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash

jobs:
  linux-tests-httpfs:
    name: MinIO Tests
    runs-on: ubuntu-latest
    env:
      CORE_EXTENSIONS: "parquet;json;tpch"
      GEN: ninja
      VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
      VCPKG_TARGET_TRIPLET: x64-linux

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'true'

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Ninja
        run: sudo apt-get update -y -qq && sudo apt-get install -y -qq ninja-build

      - name: Setup Ccache
        uses: hendrikmuhs/ccache-action@main
        with:
          key: ${{ github.job }}
          save: ${{ github.ref == 'refs/heads/main' || github.repository != 'duckdb/duckdb-httpfs' }}

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11.1
        with:
          vcpkgGitCommitId: 84bab45d415d22042bd0b9081aea57f362da3f35

      - name: Cache generated test data
        uses: actions/cache@v4
        with:
          path: test/test_data
          key: httpfs-testdata-duckdb-1.5.2-${{ hashFiles('scripts/ci/generate-data.sh') }}

      - name: Host setup (/etc/hosts + test secret permissions)
        run: sudo ./scripts/ci/setup-hosts.sh

      - name: Build
        run: make

      - name: Run CI pipeline (stack + tests + User-Agent log assertion)
        run: ./scripts/ci/run-ci-pipeline.sh

      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: httpfs-ci-logs
          path: test/httpfs_logs/
