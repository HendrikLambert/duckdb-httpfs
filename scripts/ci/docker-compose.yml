name: duckdb-ci

# Bind paths are relative to this file's dir (scripts/ci/).

services:
  # Data generator (generate-data.sh). Pin to the duckdb submodule version so
  # generated storage is compatible with the binary under test.
  datagen:
    image: duckdb/duckdb:1.5.2
    profiles: ["datagen"]
    entrypoint: ["/duckdb"]
    volumes:
      - ../../test/test_data:/data

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    hostname: duckdb-minio.com
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
      - minio-config:/root/.minio
    environment:
      - MINIO_ROOT_USER=duckdb_minio_admin
      - MINIO_ROOT_PASSWORD=duckdb_minio_admin_password
      - MINIO_REGION_NAME=eu-west-1
      - MINIO_DOMAIN=duckdb-minio.com
      - MINIO_ACCESS_KEY=duckdb_minio_admin
      - MINIO_SECRET_KEY=duckdb_minio_admin_password
    command: server /data --console-address ":9001"
    networks:
      default:
        aliases:
          - duckdb-minio.com
          - test-bucket.duckdb-minio.com
          - test-bucket-2.duckdb-minio.com
          - test-bucket-public.duckdb-minio.com

  minio-setup:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z-cpuv1
    depends_on:
      - minio
    environment:
      - SEED_DUCKDB_DATA=${SEED_DUCKDB_DATA:-0}
    volumes:
      - ../../duckdb/data:/duckdb/data:ro
      - ../../test/test_data:/duckdb/test_data:ro
      - ./setup-minio.sh:/scripts/setup-minio.sh:ro
    entrypoint: ["/bin/sh", "/scripts/setup-minio.sh"]

  # Streams S3 requests as JSONL for the UA assertion. -v is required for request
  # headers; starts after setup so setup's own mc traffic isn't captured.
  minio-trace:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z-cpuv1
    depends_on:
      minio-setup:
        condition: service_completed_successfully
    volumes:
      - ../../test/httpfs_logs:/logs
    entrypoint: >
      /bin/sh -c "
        until (
          /usr/bin/mc alias set myminio http://duckdb-minio.com:9000 duckdb_minio_admin duckdb_minio_admin_password
        ) do
          echo '...waiting...' && sleep 1;
        done;
        exec /usr/bin/mc admin trace -v --json myminio > /logs/minio-trace.jsonl
      "

  squid:
    image: ubuntu/squid:7.2-26.04_edge
    depends_on:
      - minio
    ports:
      - "3128:3128"
    volumes:
      - ./squid.conf:/etc/squid/squid.conf:ro
      - ../../test/httpfs_logs:/var/log/squid

  http:
    image: python:3.11-slim
    ports:
      - "8008:8008"
    volumes:
      - /tmp/python_test_server:/data
      - ../../duckdb/data:/data/data:ro
      - ./http_ua_server.py:/srv/http_ua_server.py:ro
      - ../../test/httpfs_logs:/logs
    working_dir: /data
    command: python /srv/http_ua_server.py 8008

volumes:
  minio-data:
  minio-config:
