name: duckdb-ci

# Bind paths are relative to this file's dir (scripts/ci/).

services:
  # Data generator (generate-data.sh). Pin to the duckdb submodule version so
  # generated storage is compatible with the binary under test.
  datagen:
    image: duckdb/duckdb:1.5.2
    profiles: ["datagen"]
    entrypoint: ["/duckdb"]
    volumes:
      - ../../test/test_data:/data

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    hostname: duckdb-minio.com
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
      - minio-config:/root/.minio
    environment:
      - MINIO_ROOT_USER=duckdb_minio_admin
      - MINIO_ROOT_PASSWORD=duckdb_minio_admin_password
      - MINIO_REGION_NAME=eu-west-1
      - MINIO_DOMAIN=duckdb-minio.com
      - MINIO_ACCESS_KEY=duckdb_minio_admin
      - MINIO_SECRET_KEY=duckdb_minio_admin_password
    command: server /data --console-address ":9001"
    networks:
      default:
        aliases:
          - duckdb-minio.com
          - test-bucket.duckdb-minio.com
          - test-bucket-2.duckdb-minio.com
          - test-bucket-public.duckdb-minio.com

  minio-setup:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z-cpuv1
    depends_on:
      - minio
    volumes:
      - ../../duckdb/data:/duckdb/data:ro
      - ../../test/test_data:/duckdb/test_data:ro
    entrypoint: >
      /bin/sh -c "
        until (
          /usr/bin/mc alias set myminio http://duckdb-minio.com:9000 duckdb_minio_admin duckdb_minio_admin_password
        ) do
          echo '...waiting...' && sleep 1;
        done;

        /usr/bin/mc admin user add myminio minio_duckdb_user minio_duckdb_user_password
        /usr/bin/mc admin policy attach myminio readwrite --user minio_duckdb_user

        /usr/bin/mc admin user add myminio minio_duckdb_user_2 minio_duckdb_user_2_password
        /usr/bin/mc admin policy attach myminio readwrite --user minio_duckdb_user_2

        /usr/bin/mc rb --force myminio/test-bucket
        /usr/bin/mc mb myminio/test-bucket
        /usr/bin/mc version enable myminio/test-bucket

        /usr/bin/mc rb --force myminio/test-bucket-2
        /usr/bin/mc mb myminio/test-bucket-2

        /usr/bin/mc rb --force myminio/test-bucket-public
        /usr/bin/mc mb myminio/test-bucket-public
        /usr/bin/mc anonymous set public myminio/test-bucket-public

        /usr/bin/mc cp /duckdb/data/csv/phonenumbers.csv myminio/test-bucket/presigned/phonenumbers.csv
        /usr/bin/mc cp /duckdb/data/parquet-testing/glob/t1.parquet myminio/test-bucket/presigned/t1.parquet
        /usr/bin/mc cp /duckdb/test_data/presigned-url-lineitem.parquet myminio/test-bucket/presigned/lineitem_large.parquet
        /usr/bin/mc cp /duckdb/test_data/attach.db myminio/test-bucket/presigned/attach.db
        /usr/bin/mc cp /duckdb/test_data/lineitem_sf1.db myminio/test-bucket/presigned/lineitem_sf1.db

        /usr/bin/mc share download myminio/test-bucket/presigned/phonenumbers.csv
        /usr/bin/mc share download myminio/test-bucket/presigned/t1.parquet
        /usr/bin/mc share download myminio/test-bucket/presigned/lineitem_large.parquet
        /usr/bin/mc share download myminio/test-bucket/presigned/attach.db

        echo 'FINISHED SETTING UP MINIO'
        exit 0;
      "

  # Streams S3 requests as JSONL for the UA assertion. -v is required for request
  # headers; starts after setup so setup's own mc traffic isn't captured.
  minio-trace:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z-cpuv1
    depends_on:
      minio-setup:
        condition: service_completed_successfully
    volumes:
      - ../../test/httpfs_logs:/logs
    entrypoint: >
      /bin/sh -c "
        until (
          /usr/bin/mc alias set myminio http://duckdb-minio.com:9000 duckdb_minio_admin duckdb_minio_admin_password
        ) do
          echo '...waiting...' && sleep 1;
        done;
        exec /usr/bin/mc admin trace -v --json myminio > /logs/minio-trace.jsonl
      "

  squid:
    image: ubuntu/squid:latest
    depends_on:
      - minio
    ports:
      - "3128:3128"
    volumes:
      - ./squid.conf:/etc/squid/squid.conf:ro
      - ../../test/httpfs_logs:/var/log/squid

  http:
    image: python:3.11-slim
    ports:
      - "8008:8008"
    volumes:
      - /tmp/python_test_server:/data
      - ./http_ua_server.py:/srv/http_ua_server.py:ro
      - ../../test/httpfs_logs:/logs
    working_dir: /data
    command: python /srv/http_ua_server.py 8008

volumes:
  minio-data:
  minio-config:
