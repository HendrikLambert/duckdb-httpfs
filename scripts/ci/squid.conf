# Test-only forward proxy that logs each request's User-Agent (missing UA -> "UA:-").
http_port 3128

logformat ua %ts.%03tu %>a %Ss/%>Hs %rm %ru "UA:%{User-Agent}>h"
access_log stdio:/var/log/squid/squid-access.log ua
cache_log /dev/null

# No caching: exactly one proxied request per client request.
cache deny all
http_access allow all
