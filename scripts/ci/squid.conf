# Test-only forward proxy that logs each request's full received header set.
http_port 3128

# %#>h is the full received header block, URL-encoded so it stays on one line.
logformat hdrs %ts.%03tu %>a %Ss/%>Hs %rm %ru %#>h
access_log stdio:/var/log/squid/squid-access.log hdrs
cache_log /dev/null

# No caching: exactly one proxied request per client request.
cache deny all
http_access allow all
