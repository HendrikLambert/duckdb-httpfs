# Test-only forward proxy that logs each request and response header set.
http_port 3128

# %#>h and %#<h are URL-encoded request and response header blocks.
logformat hdrs %ts.%03tu %>a %Ss/%>Hs %rm %ru %#>h %#<h
access_log stdio:/var/log/squid/squid-access.log hdrs
cache_log /dev/null

# No caching: exactly one proxied request per client request.
cache deny all
http_access allow all
